<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Page</title>

    <link rel="stylesheet" href="styles/place.css">
    <link rel="stylesheet" href="styles/place-large.css">

    <script src="scripts/place.js" defer></script>
</head>
<body>
<header>
    <h1>Lagos, Nigeria</h1>
</header>

<main>

    <picture>
        <source srcset="images/hero-large.webp" media="(min-width: 768px)">
        <img src="images/hero-small.webp" alt="Lagos city view">
    </picture>

    <section class="card">
        <h2>Data</h2>

        <p><strong>Area:</strong> 1,171 km²</p>
        <p><strong>Population:</strong> 15 million+</p>
        <p><strong>Language:</strong> English</p>
        <p><strong>Currency:</strong> Naira</p>
    </section>

    <section class="card weather">
        <h2>Weather</h2>

        <img src="images/weather.svg" alt="Weather icon" class="weather-icon">

        <p><strong>Temperature:</strong> <span id="temp">8</span>°C</p>
        <p><strong>Wind Speed:</strong> <span id="speed">10</span> km/h</p>
        <p><strong>Wind Chill:</strong> <span id="windchill"></span></p>
    </section>

</main>

<footer>
    <p>
        © <span id="year"></span> Gerald Abiayi
    </p>

    <p id="lastModified"></p>
</footer>
    
</body>
</html>
