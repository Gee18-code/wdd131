
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a product review and share your experience with its features and performance.">
    <meta name="author" content="Gerald">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get">
            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>
                <div class="rating-options">
                    <label for="rating1">
                        <span>☆</span>
                        <input type="radio" id="rating1" name="rating" value="1" required>
                    </label>
                    <label for="rating2">
                        <span>☆☆</span>
                        <input type="radio" id="rating2" name="rating" value="2">
                    </label>
                    <label for="rating3">
                        <span>☆☆☆</span>
                        <input type="radio" id="rating3" name="rating" value="3">
                    </label>
                    <label for="rating4">
                        <span>☆☆☆☆</span>
                        <input type="radio" id="rating4" name="rating" value="4">
                    </label>
                    <label for="rating5">
                        <span>☆☆☆☆☆</span>
                        <input type="radio" id="rating5" name="rating" value="5">
                    </label>
                </div>
            </fieldset>

            <label for="installation-date">Date of Installation</label>
            <input type="date" id="installation-date" name="installation-date" required>

            <fieldset>
                <legend>Which features did you find useful?</legend>
                <p><em>Check all that apply</em></p>

                <label class="checkbox-label" for="durability">
                    <input type="checkbox" id="durability" name="features" value="Durability">
                    Durability
                </label>

                <label class="checkbox-label" for="ease-of-use">
                    <input type="checkbox" id="ease-of-use" name="features" value="Ease of Use">
                    Ease of Use
                </label>

                <label class="checkbox-label" for="performance">
                    <input type="checkbox" id="performance" name="features" value="Performance">
                    Performance
                </label>

                <label class="checkbox-label" for="design">
                    <input type="checkbox" id="design" name="features" value="Design">
                    Design
                </label>
            </fieldset>

            <label for="written-review">Written Review (Optional)</label>
            <textarea id="written-review" name="written-review" rows="5"></textarea>

            <label for="user-name">Your Name (Optional)</label>
            <input type="text" id="user-name" name="user-name">

            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>&copy; 2026 | Product Review</p>
        <p>WDD131 Web Frontend Development</p>
    </footer>
</body>
</html>
