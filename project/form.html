<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review Form | WDD 131</title>
  <meta name="description" content="Share your experience with a product by rating it, choosing its useful features, and writing a review.">
  <meta name="author" content="Gerald Chukwuebuka Abiayi">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Open+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review</h1>
    <p>Tell us how your product is working out.</p>
  </header>

  <main>
    <form action="review.html" method="get">
      <p class="note"><span class="req" aria-hidden="true">*</span> Required field</p>

      <div class="field">
        <label for="product">Product Name <span class="req" aria-hidden="true">*</span></label>
        <select id="product" name="product" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>
      </div>

      <fieldset class="rating">
        <legend>Overall Rating <span class="req" aria-hidden="true">*</span></legend>
        <div class="stars">
          <input type="radio" id="rating5" name="rating" value="5" required>
          <label for="rating5"><span class="star" aria-hidden="true"></span><span class="sr-only">5 stars</span></label>
          <input type="radio" id="rating4" name="rating" value="4">
          <label for="rating4"><span class="star" aria-hidden="true"></span><span class="sr-only">4 stars</span></label>
          <input type="radio" id="rating3" name="rating" value="3">
          <label for="rating3"><span class="star" aria-hidden="true"></span><span class="sr-only">3 stars</span></label>
          <input type="radio" id="rating2" name="rating" value="2">
          <label for="rating2"><span class="star" aria-hidden="true"></span><span class="sr-only">2 stars</span></label>
          <input type="radio" id="rating1" name="rating" value="1">
          <label for="rating1"><span class="star" aria-hidden="true"></span><span class="sr-only">1 star</span></label>
        </div>
      </fieldset>

      <div class="field">
        <label for="installdate">Date of Installation <span class="req" aria-hidden="true">*</span></label>
        <input type="date" id="installdate" name="installdate" required>
      </div>

      <fieldset>
        <legend>Useful Features</legend>
        <div class="check">
          <input type="checkbox" id="durability" name="features" value="durability">
          <label for="durability">Durability</label>
        </div>
        <div class="check">
          <input type="checkbox" id="ease" name="features" value="ease-of-use">
          <label for="ease">Ease of use</label>
        </div>
        <div class="check">
          <input type="checkbox" id="appearance" name="features" value="appearance">
          <label for="appearance">Appearance</label>
        </div>
        <div class="check">
          <input type="checkbox" id="value" name="features" value="value-for-money">
          <label for="value">Value for money</label>
        </div>
      </fieldset>

      <div class="field">
        <label for="review">Written Review</label>
        <textarea id="review" name="review" rows="5"></textarea>
      </div>

      <div class="field">
        <label for="username">Your Name</label>
        <input type="text" id="username" name="username" autocomplete="name">
      </div>

      <input type="submit" value="Submit Review">
    </form>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> | Gerald Chukwuebuka Abiayi | Lagos, Nigeria</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
